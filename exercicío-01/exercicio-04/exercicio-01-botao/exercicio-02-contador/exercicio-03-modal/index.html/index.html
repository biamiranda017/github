<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal de Aviso</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #ffd7b5, #ff8fb3);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;

            width: 90%;
            max-width: 500px;

            padding: 50px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #5a3a26;

            margin-bottom: 15px;
        }

        p {
            color: #666;

            margin-bottom: 30px;
        }

        #abrirModal {
            padding: 14px 30px;

            border: none;

            border-radius: 10px;

            background-color: #ff8fb3;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        #abrirModal:hover {
            background-color: #e8759a;
        }

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background-color: rgba(0, 0, 0, 0.6);

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .modal-conteudo {
            width: 100%;
            max-width: 450px;

            background-color: white;

            padding: 35px;

            border-radius: 18px;

            text-align: center;

            position: relative;

            animation: aparecer 0.3s ease;
        }

        .fechar {
            position: absolute;

            top: 12px;
            right: 18px;

            border: none;

            background: none;

            font-size: 28px;

            color: #777;

            cursor: pointer;
        }

        .modal-conteudo h2 {
            color: #5a3a26;

            margin-bottom: 15px;
        }

        .modal-conteudo p {
            margin-bottom: 0;
        }

        @keyframes aparecer {

            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Modal de Aviso</h1>

        <p>
            Clique no botão para visualizar o aviso.
        </p>

        <button id="abrirModal">
            Abrir aviso
        </button>

    </main>


    <div id="modal" class="modal">

        <div class="modal-conteudo">

            <button class="fechar" id="fecharModal">
                &times;
            </button>

            <h2>⚠️ Aviso</h2>

            <p>
                Esta é uma mensagem de aviso exibida através de um modal.
            </p>

        </div>

    </div>


    <script>

        const abrirModal = document.getElementById("abrirModal");
        const fecharModal = document.getElementById("fecharModal");
        const modal = document.getElementById("modal");

        abrirModal.addEventListener("click", function () {

            modal.style.display = "flex";

        });

        fecharModal.addEventListener("click", function () {

            modal.style.display = "none";

        });

        modal.addEventListener("click", function (evento) {

            if (evento.target === modal) {

                modal.style.display = "none";

            }

        });

    </script>

</body>

</html>
