<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeria Interativa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background-color: #fff0f5;

            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;

            margin: auto;
        }

        h1 {
            text-align: center;

            color: #5a3a26;

            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;

            color: #777;

            margin-bottom: 35px;
        }

        .galeria {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .imagem {
            width: 100%;

            height: 220px;

            object-fit: cover;

            border-radius: 15px;

            cursor: pointer;

            transition: 0.3s;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .imagem:hover {
            transform: scale(1.04);
        }

        .visualizador {
            display: none;

            position: fixed;

            inset: 0;

            background-color: rgba(0, 0, 0, 0.8);

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 10;
        }

        .imagem-ampliada {
            max-width: 90%;

            max-height: 85vh;

            border-radius: 12px;
        }

        .fechar {
            position: absolute;

            top: 20px;
            right: 30px;

            color: white;

            font-size: 40px;

            cursor: pointer;
        }

        @media (max-width: 700px) {

            .galeria {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 450px) {

            .galeria {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Galeria Interativa</h1>

        <p class="descricao">
            Clique em uma imagem para ampliá-la.
        </p>

        <section class="galeria">

            <img
                class="imagem"
                src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80"
                alt="Café"
            >

            <img
                class="imagem"
                src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=800&q=80"
                alt="Restaurante"
            >

            <img
                class="imagem"
                src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80"
                alt="Comida"
            >

            <img
                class="imagem"
                src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=800&q=80"
                alt="Alimentos"
            >

            <img
                class="imagem"
                src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=800&q=80"
                alt="Cozinha"
            >

            <img
                class="imagem"
                src="https://images.unsplash.com/photo-1504754524776-8f4f37790ca0?auto=format&fit=crop&w=800&q=80"
                alt="Café da manhã"
            >

        </section>

    </main>


    <div id="visualizador" class="visualizador">

        <span id="fechar" class="fechar">
            &times;
        </span>

        <img
            id="imagemAmpliada"
            class="imagem-ampliada"
            src=""
            alt=""
        >

    </div>


    <script>

        const imagens = document.querySelectorAll(".imagem");

        const visualizador = document.getElementById("visualizador");

        const imagemAmpliada = document.getElementById("imagemAmpliada");

        const fechar = document.getElementById("fechar");


        imagens.forEach(function (imagem) {

            imagem.addEventListener("click", function () {

                visualizador.style.display = "flex";

                imagemAmpliada.src = imagem.src;

                imagemAmpliada.alt = imagem.alt;

            });

        });


        fechar.addEventListener("click", function () {

            visualizador.style.display = "none";

        });


        visualizador.addEventListener("click", function (evento) {

            if (evento.target === visualizador) {

                visualizador.style.display = "none";

            }

        });

    </script>

</body>

</html>
