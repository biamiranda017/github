<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro com Validação</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #fff0f5;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #5a3a26;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ff8fb3;
        }

        small {
            color: #777;
            line-height: 1.4;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #ff8fb3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e8759a;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Cadastro</h1>

            <p class="descricao">
                Preencha os campos corretamente.
            </p>

            <form>

                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo de 8 caracteres"
                        minlength="8"
                        pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                        title="A senha deve ter pelo menos 8 caracteres, contendo letras e números."
                        required
                    >

                    <small>
                        A senha deve possuir pelo menos 8 caracteres,
                        contendo letras e números.
                    </small>

                </div>

                <button type="submit">Cadastrar</button>

            </form>

        </section>

    </main>

</body>
</html>
