<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro com Validação</title>
</head>
<body>

    <h1>Cadastro</h1>

    <form>
        <label for="email">E-mail:</label>
        <input 
            type="email" 
            id="email" 
            name="email"
            placeholder="seuemail@email.com"
            required
        >

        <br><br>

        <label for="senha">Senha:</label>
        <input 
            type="password"
            id="senha"
            name="senha"
            minlength="8"
            pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
            title="A senha deve ter pelo menos 8 caracteres, contendo letras e números."
            required
        >

        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

</body>
</html>
