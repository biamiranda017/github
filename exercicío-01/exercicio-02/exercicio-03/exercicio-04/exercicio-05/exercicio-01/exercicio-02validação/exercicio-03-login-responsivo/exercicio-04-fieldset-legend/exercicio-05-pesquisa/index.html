<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
        }

        .pesquisa {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="pesquisa">

        <h1>Pesquisa</h1>

        <form>
            <label for="pesquisa">O que você deseja pesquisar?</label>

            <input 
                type="search" 
                id="pesquisa"
                name="pesquisa"
                placeholder="Digite sua pesquisa..."
                required
            >

            <button type="submit">Pesquisar</button>
        </form>

    </div>

</body>
</html>
