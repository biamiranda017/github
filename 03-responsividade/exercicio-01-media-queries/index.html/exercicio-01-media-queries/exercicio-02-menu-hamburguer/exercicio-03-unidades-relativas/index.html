<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unidades Relativas</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: Arial, sans-serif;

            background-color: #fff0f5;

            padding: 2rem;
        }

        .container {
            width: 90%;

            max-width: 60rem;

            margin: 0 auto;
        }

        .card {
            width: 100%;

            background-color: white;

            padding: 2rem;

            border-radius: 1rem;

            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 2rem;

            color: #5a3a26;

            margin-bottom: 1em;
        }

        p {
            font-size: 1rem;

            line-height: 1.6;

            color: #666;

            margin-bottom: 1em;
        }

        .destaque {
            width: 80%;

            margin: 2rem auto;

            padding: 1.5rem;

            background-color: #ffd7b5;

            border-radius: 1em;

            text-align: center;
        }

        .destaque strong {
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {

            body {
                padding: 1rem;
            }

            .card {
                padding: 1.2rem;
            }

            h1 {
                font-size: 1.6rem;
            }

        }

    </style>

</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Unidades Relativas</h1>

            <p>
                Este layout utiliza unidades relativas como
                rem, em e porcentagem.
            </p>

            <p>
                Dessa forma, os elementos conseguem se adaptar
                melhor aos diferentes tamanhos de tela.
            </p>


            <div class="destaque">

                <strong>
                    Layout adaptável
                </strong>

                <p>
                    Este elemento utiliza porcentagem,
                    em e rem.
                </p>

            </div>

        </section>

    </main>

</body>

</html>
