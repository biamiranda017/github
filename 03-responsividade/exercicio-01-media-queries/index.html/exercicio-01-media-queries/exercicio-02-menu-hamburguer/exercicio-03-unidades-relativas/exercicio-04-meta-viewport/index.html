<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!-- Meta viewport responsável pela adaptação em dispositivos móveis -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meta Viewport</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background-color: #fff0f5;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 5%;
        }

        .card {
            width: 90%;

            max-width: 600px;

            background-color: white;

            padding: 3rem;

            border-radius: 1rem;

            text-align: center;

            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #5a3a26;

            margin-bottom: 1rem;
        }

        p {
            color: #666;

            line-height: 1.6;
        }

        @media (max-width: 600px) {

            .card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

        }

    </style>

</head>

<body>

    <main class="card">

        <h1>Meta Viewport</h1>

        <p>
            Esta página utiliza a meta viewport para que
            o conteúdo seja exibido corretamente em
            dispositivos móveis.
        </p>

    </main>

</body>

</html>
