<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu Responsivo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
        }

        header {
            background-color: #8b5e3c;
            padding: 1rem 5%;
        }

        nav {
            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .logo {
            color: white;

            font-size: 1.5rem;

            font-weight: bold;
        }

        .menu {
            display: flex;

            list-style: none;

            gap: 2rem;
        }

        .menu a {
            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .menu a:hover {
            color: #ffd7b5;
        }

        .hamburguer {
            display: none;

            background: none;

            border: none;

            color: white;

            font-size: 2rem;

            cursor: pointer;
        }

        .conteudo {
            width: 90%;

            max-width: 900px;

            margin: 4rem auto;

            text-align: center;
        }

        .conteudo h1 {
            color: #5a3a26;

            margin-bottom: 1rem;
        }

        .conteudo p {
            color: #666;

            line-height: 1.6;
        }

        @media (max-width: 650px) {

            .hamburguer {
                display: block;
            }

            .menu {
                display: none;

                flex-direction: column;

                gap: 1rem;

                text-align: center;

                padding-top: 1rem;
            }

            .menu.ativo {
                display: flex;
            }

            nav {
                flex-wrap: wrap;
            }

            .menu {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <header>

        <nav>

            <div class="logo">
                Meu Portfólio
            </div>


            <button class="hamburguer" id="hamburguer">
                ☰
            </button>


            <ul class="menu" id="menu">

                <li>
                    <a href="#">Início</a>
                </li>

                <li>
                    <a href="#">Sobre</a>
                </li>

                <li>
                    <a href="#">Projetos</a>
                </li>

                <li>
                    <a href="#">Contato</a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="conteudo">

        <h1>Menu Responsivo</h1>

        <p>
            Reduza o tamanho da tela para visualizar
            o menu hambúrguer.
        </p>

    </main>


    <script>

        const hamburguer = document.getElementById("hamburguer");

        const menu = document.getElementById("menu");


        hamburguer.addEventListener("click", function () {

            menu.classList.toggle("ativo");

        });

    </script>

</body>

</html>
